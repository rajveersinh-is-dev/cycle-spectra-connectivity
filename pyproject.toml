[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cycle-spectra"
version = "1.0.0"
description = "Cycle-count spectra of graphs of prescribed connectivity: exact counting, complete generators, and proved bounds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cycle-spectra-connectivity contributors" }]
keywords = ["graph theory", "cycles", "connectivity", "enumeration", "extremal"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "igraph>=0.10",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Paper = "https://github.com/daveaddams91-dev/cycle-spectra-connectivity/blob/main/paper/main.tex"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:cycle_spectra.*"]